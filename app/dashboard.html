<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liriano & Son">
  <script>
    (function() {
      var base = document.createElement('base');
      base.href = location.protocol === 'file:'
        ? location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1)
        : '/app/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/webp" href="../images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Liriano & Son — Dashboard</title>
</head>
<body>
<script>(function(){fetch('/app/api/auth.php',{credentials:'same-origin'}).then(function(r){if(!r.ok)window.location.href='/app/'}).catch(function(){window.location.href='/app/'})})();</script>
  <div class="app-container" style="display:flex">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-brand" id="headerBrand">
          <img src="../images/logo.webp" alt="" class="app-header-logo">
          <span class="app-header-title">Liriano <span>&amp;</span> Son</span>
        </div>
        <div class="app-header-lang">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="es">ES</button>
        </div>
        <button class="app-install" id="installBtn" style="display:none" title="Install App">
          <i class="fas fa-download"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="home-content" style="padding-top:30px">
        <div class="dash-header" style="margin-bottom:8px">
          <button class="dash-home" id="dashHome"><i class="fas fa-home"></i></button>
        </div>
        <div class="dash-section-title" data-i18n="dashboard_stats">Overview</div>
        <div class="stats-grid" id="dashboardStats">
          <div class="stat-card">
            <i class="fas fa-file-contract"></i>
            <div>
              <span class="stat-card-value" id="statEstimados">0</span>
              <span class="stat-card-label" data-i18n="estimados">Estimates</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-file-invoice"></i>
            <div>
              <span class="stat-card-value" id="statFacturas">0</span>
              <span class="stat-card-label" data-i18n="facturas">Invoices</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-check-circle"></i>
            <div>
              <span class="stat-card-value" id="statCompletados">0</span>
              <span class="stat-card-label" data-i18n="completed">Completed</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-dollar-sign"></i>
            <div>
              <span class="stat-card-value" id="statTotalValue">$0</span>
              <span class="stat-card-label" data-i18n="total_value">Total Value</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-hand-holding-usd"></i>
            <div>
              <span class="stat-card-value" id="statDeposits">$0</span>
              <span class="stat-card-label" data-i18n="deposits">Deposits</span>
            </div>
          </div>
          <div class="stat-card">
            <i class="fas fa-percentage"></i>
            <div>
              <span class="stat-card-value" id="statConversion">0%</span>
              <span class="stat-card-label" data-i18n="conversion_rate">Conv. Rate</span>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="dashboard.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('/app/sw.js').catch(function(){});
    }
    startHeartbeat();
  </script>
</body>
</html>
