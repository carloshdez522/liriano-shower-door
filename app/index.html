<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liriano & Son">
  <script>
    (function() {
      var base = document.createElement('base');
      base.href = location.protocol === 'file:'
        ? location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1)
        : '/app/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/webp" href="../images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Liriano & Son — App</title>
</head>
<body class="login-page">
  <div class="login-bg"></div>

  <div class="login-card" id="loginCard">
    <div class="login-logo">
      <img src="../images/logo.webp" alt="Liriano & Son">
    </div>
    <h1 class="login-title">Liriano <span>&amp;</span> Son</h1>
    <p class="login-subtitle">Shower Doors Corp</p>
    <form id="loginForm" class="login-form">
      <div class="input-group">
        <i class="fas fa-user"></i>
        <input type="text" id="username" data-i18n-placeholder="login_user_ph" placeholder="Username" autocomplete="username" required>
      </div>
      <div class="input-group">
        <i class="fas fa-lock"></i>
        <input type="password" id="password" data-i18n-placeholder="login_pass_ph" placeholder="Password" autocomplete="current-password" required>
        <button type="button" class="toggle-pass" id="togglePass" tabindex="-1">
          <i class="fas fa-eye"></i>
        </button>
      </div>
      <p class="login-error" id="loginError"></p>
      <button type="submit" class="login-btn" id="loginBtn">
        <span data-i18n="login_btn">Log In</span>
        <i class="fas fa-arrow-right"></i>
      </button>
    </form>
    <div class="login-lang">
      <button class="lang-btn active" data-lang="en">EN</button>
      <span class="lang-sep">|</span>
      <button class="lang-btn" data-lang="es">ES</button>
    </div>
  </div>

  <div class="app-container" id="appContainer" style="display:none">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-brand" id="headerBrand">
          <img src="../images/logo.webp" alt="" class="app-header-logo">
          <span class="app-header-title">Liriano <span>&amp;</span> Son</span>
        </div>
        <div class="app-header-lang">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="es">ES</button>
        </div>
        <button class="app-install" id="installBtn" style="display:none" title="Install App">
          <i class="fas fa-download"></i>
        </button>
        <button class="app-logout" id="logoutBtn" title="Log out">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div id="dashboardView">
        <div class="home-content">
          <div class="home-cards">
            <button class="home-card" id="dashboardJobs">
              <i class="fas fa-clipboard-list"></i>
              <span class="home-card-title" data-i18n="manage_jobs">Manage Jobs</span>
            </button>
            <button class="home-card" id="dashboardRecords">
              <i class="fas fa-folder-open"></i>
              <span class="home-card-title" data-i18n="records">Records</span>
            </button>
            <button class="home-card" id="dashboardStatsCard">
              <i class="fas fa-chart-bar"></i>
              <span class="home-card-title" data-i18n="dashboard">Dashboard</span>
            </button>
            <button class="home-card" id="pendingReviews">
              <i class="fas fa-clock"></i>
              <span class="home-card-title" data-i18n="pending_reviews">Pending Reviews</span>
            </button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="index.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('/app/sw.js').catch(function(){});
    }
  </script>
</body>
</html>
