<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liriano & Son">
  <script>
    (function() {
      var base = document.createElement('base');
      base.href = location.protocol === 'file:'
        ? location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1)
        : '/app/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/webp" href="../images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Liriano & Son — Records</title>
</head>
<body>
  <div class="app-container" id="appContainer" style="display:flex">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-brand" id="headerBrand">
          <img src="../images/logo.webp" alt="" class="app-header-logo">
          <span class="app-header-title">Liriano <span>&amp;</span> Son</span>
        </div>
        <div class="app-header-lang">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="es">ES</button>
        </div>
        <button class="app-install" id="installBtn" style="display:none" title="Install App">
          <i class="fas fa-download"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="dash-header">
        <h2 class="form-view-title" data-i18n="records" style="margin:0">Records</h2>
      </div>
      <div class="job-list" id="recordList">
        <div class="empty-state">
          <i class="fas fa-folder-open"></i>
          <p data-i18n="empty">No records yet.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="playfair-font.js"></script>
  <script src="greatvibes-font.js"></script>
  <script src="social-icons.js"></script>
  <script src="common.js"></script>
  <script src="record.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/app/sw.js');
    }
  </script>
</body>
</html>
