<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Liriano & Son">
  <script>
    (function() {
      var base = document.createElement('base');
      base.href = location.protocol === 'file:'
        ? location.pathname.substring(0, location.pathname.lastIndexOf('/') + 1)
        : '/app/';
      document.head.appendChild(base);
    })();
  </script>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/webp" href="../images/logo.webp">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <title>Liriano & Son — Records</title>
</head>
<body>
  <div class="app-container" id="appContainer" style="display:flex">
    <header class="app-header">
      <div class="app-header-inner">
        <div class="app-header-brand" id="headerBrand">
          <img src="../images/logo.webp" alt="" class="app-header-logo">
          <span class="app-header-title">Liriano <span>&amp;</span> Son</span>
        </div>
        <div class="app-header-lang">
          <button class="lang-btn active" data-lang="en">EN</button>
          <span class="lang-sep">|</span>
          <button class="lang-btn" data-lang="es">ES</button>
        </div>
        <button class="app-install" id="installBtn" style="display:none" title="Install App">
          <i class="fas fa-download"></i>
        </button>
      </div>
    </header>

    <main class="app-main">
      <div class="records-stats" id="recordsStats">
        <div class="stat-item">
          <span class="stat-value" id="statAllCount">0</span>
          <span class="stat-label" data-i18n="records_stats_all">Records</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="statCount">0</span>
          <span class="stat-label" data-i18n="records_stats_count">Records Completed</span>
        </div>
        <div class="stat-item">
          <span class="stat-value" id="statTotal">$0.00</span>
          <span class="stat-label" data-i18n="records_stats_total">Total Collected</span>
        </div>
      </div>

      <div class="dash-header records-controls">
        <button class="dash-home" id="dashHome"><i class="fas fa-home"></i></button>
        <div class="dash-search">
          <i class="fas fa-search"></i>
          <input type="text" id="searchInput" data-i18n-placeholder="records_search_ph" placeholder="Search records...">
        </div>
        <button class="job-action-btn" id="exportCsvBtn" style="flex-shrink:0;padding:8px 12px">
          <i class="fas fa-download"></i> <span data-i18n="records_export_csv">Export CSV</span>
        </button>
      </div>

      <div class="dash-filters" id="filterBar">
        <button class="filter-btn active" data-filter="all"><span data-i18n="all">All</span></button>
        <button class="filter-btn" data-filter="estimado"><span data-i18n="estimados">Estimates</span></button>
        <button class="filter-btn" data-filter="invoice"><span data-i18n="facturas">Invoices</span></button>
        <button class="filter-btn" data-filter="done"><span data-i18n="completed">Completed</span></button>
        <button class="filter-btn" data-filter="deleted"><span data-i18n="deleted">Deleted</span></button>
      </div>
      <div class="date-filter-bar" id="dateFilterBar">
        <span class="date-filter-label" data-i18n="records_filter_from">From</span>
        <input type="date" id="filterFrom" class="date-filter-input">
        <span class="date-filter-label" data-i18n="records_filter_to">To</span>
        <input type="date" id="filterTo" class="date-filter-input">
        <button class="filter-clear-btn" id="filterClear" title="Clear filters"><span data-i18n="records_filter_clear">Clear</span> <i class="fas fa-times"></i></button>
      </div>


      <div class="job-list" id="recordList">
        <div class="empty-state">
          <i class="fas fa-folder-open"></i>
          <p data-i18n="empty">No records yet.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
  <script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
  <script src="plantilla.js"></script>
  <script src="common.js"></script>
  <script src="record.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
